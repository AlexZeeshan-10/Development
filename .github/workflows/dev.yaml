name: Web dev CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  check-changed-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install HTMLHint
        run: npm install -g htmlhint

      - name: Check changed HTML files for errors
        run: |
          git config core.quotePath false

          # Get list of changed HTML files only (Added or Modified, not renames)
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only --diff-filter=AM ${{ github.event.pull_request.base.sha }} HEAD -- '*.html')
          else
            if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
              CHANGED_FILES=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- '*.html')
            else
              CHANGED_FILES=$(git diff --name-only --diff-filter=AM ${{ github.event.before }} ${{ github.sha }} -- '*.html')
            fi
          fi

          # If no HTML files changed, skip cleanly
          if [ -z "$CHANGED_FILES" ]; then
            echo "No HTML files changed. Skipping checks."
            exit 0
          fi

          # Run HTMLHint only on changed HTML files
          echo "$CHANGED_FILES" | while IFS= read -r file; do
            if [ -z "$file" ] || [ ! -f "$file" ]; then continue; fi
            echo "--> Checking '$file'"
            htmlhint "$file"
          done

          echo "All changed HTML files passed!"